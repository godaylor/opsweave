name: OpsWeave
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify independent dependency closure
        run: |
          node -e "const p=require('./package-lock.json'); for (const [name,v] of Object.entries(p.packages)) if (v.link || name.includes('..') || /@novu|bullmq-pro/.test(name)) throw Error('Forbidden dependency '+name)"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build --tag opsweave:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            screenshots/
            test-results/
