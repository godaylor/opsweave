name: Validate and deploy static demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["public/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: opsweave-static-demo
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Assert static-only publication boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/NOTICE.html
          if grep -RIE '@novu/|enterprise/|\.source/|BEGIN .*PRIVATE KEY|eyJ[A-Za-z0-9_-]{12,}\.' public; then
            echo 'Forbidden runtime, private path, key or token marker in public demo' >&2
            exit 1
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - name: Deploy static demo only
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
